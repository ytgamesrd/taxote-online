<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXOTE | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #0b2e47; display: grid; place-items: center; height: 100vh; margin: 0; color: #fff; }
        .login-card { background: #fff; color: #0b2e47; padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); width: 100%; max-width: 380px; text-align: center; }
        .brand-mark { width: 60px; height: 60px; background: #0b2e47; color: #f4c400; border-radius: 12px; display: grid; place-items: center; font-size: 32px; font-weight: 900; margin: 0 auto 20px; }
        h1 { margin-bottom: 30px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; font-size: 24px; }
        input { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #edf2f7; border-radius: 12px; box-sizing: border-box; font-size: 16px; font-weight: 600; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #f4c400; }
        button { width: 100%; padding: 16px; background: #0b2e47; border: 0; border-radius: 12px; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #1a3a5a; transform: translateY(-2px); }
        .error { color: #d32f2f; margin-top: 20px; font-size: 14px; font-weight: 700; display: none; }
    .welcome-kicker{margin:8px 0 0;color:#d39f00;font-weight:900;font-size:11px;letter-spacing:2px}.welcome-sub{color:#627886;font-size:13px;line-height:1.5;margin:-8px 0 18px}.login-card{box-shadow:0 28px 90px rgba(0,0,0,.32)!important;border:1px solid rgba(255,255,255,.5)} body{background-image:radial-gradient(circle at 20% 25%,rgba(244,196,0,.18),transparent 35%),linear-gradient(120deg,rgba(4,31,49,.95),rgba(8,64,88,.88)),url("/assets/taxote-car-v3.png")!important;background-repeat:no-repeat!important;background-position:center!important;background-size:auto,auto,420px auto!important}</style>
</head>
<body>
    <div class="login-card">
        <div class="brand-mark">T</div>
        <p class="welcome-kicker">BIENVENIDO A</p><h1>TAXOTE Central</h1><p class="welcome-sub">Inicia sesión para administrar reservas, conductores y operaciones.</p>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuario" required autocomplete="username">
            <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
            <button type="submit">INICIAR SESIÓN</button>
            <div id="error-msg" class="error"></div>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    const urlParams = new URLSearchParams(window.location.search);
                    let next = urlParams.get('next') || '/';
                    try {
                        const target = new URL(next, location.origin);
                        if (target.origin !== location.origin || target.pathname === '/admin-login' || target.pathname === '/admin-login.html') next = '/';
                    } catch { next = '/'; }
                    location.href = next;
                } else {
                    errorMsg.textContent = data.error || 'Error al iniciar sesión';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión con el servidor';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
